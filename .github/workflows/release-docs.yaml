name: Documentation release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  docs-release:
    permissions:
      contents: write
    uses: canonical/starflow/.github/workflows/release-docs.yaml@work/rtd-release-automation/CRAFT-5278
    with:
      rtd-project: canonical-ecoldi-test
    secrets:
      RTD_TOKEN: ${{ secrets.RTD_TOKEN }}